# Sigma HEAD vs the frozen Warrant 0.x consumer, not Warrant 2.
# Runtime/normative pins in other workflows are unchanged. This required job
# retains the historical contract checks and their negative controls; mirrored
# source equality E is retired because Warrant no longer maintains that copy.
# This is a regression lane, not an independent review.
name: x1-cross-repo

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Daily. The sibling can move without touching this repo, so time — not our
    # own pushes — is the trigger that actually catches sibling-side drift.
    - cron: '17 5 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [sibling-head-moved]

concurrency:
  group: x1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-repo:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.24'

      - name: Install python deps
        run: >-
          pip install --quiet --only-binary=:all:
          'cryptography==45.0.7'

      - name: Clone the historical Warrant consumer and verify its commit
        run: |
          set -euo pipefail
          SIB=warrant
          PIN=$(cat tools/x1-warrant-commit)
          git clone -q --depth 1 --branch history/warrant-0.x-2026-10-18 \
            https://github.com/s0fractal/warrant.git /tmp/warrant
          test "$(git -C /tmp/warrant rev-parse HEAD)" = "$PIN"
          echo "SIBLING=/tmp/$SIB" >> "$GITHUB_ENV"
          echo "X1 sibling: $SIB @ $(git -C /tmp/$SIB rev-parse --short HEAD)"

      - name: X1 compatibility matrix (Sigma vs frozen Warrant 0.x)
        env:
          X1_SEEDS: '1 2 3'
          # Required crossings that cannot run fail; no degraded CI mode.
          X1_DEGRADED: '0'
        run: bash tools/x1_cross_repo.sh

      - name: Negative control — the gate must be able to FAIL
        # Guards against a vacuous green. Each control corrupts one thing in the
        # sibling and names the X1 step that must go red; a control that finds
        # nothing to tamper, or turns a *different* step red, fails the job.
        # Covers every Book I vector kind separately and an
        # unbuildable sibling — see the header of tools/x1_negative_control.sh
        # for the drafts of this file that were themselves vacuous.
        env:
          X1_DEGRADED: '0'
        run: bash tools/x1_negative_control.sh
