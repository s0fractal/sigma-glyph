name: conformance
on: [push, pull_request]

# ONE pin of the sibling repo, for the whole workflow.
#
# Three steps below consume warrant artifacts — the Go evaluator, impl/warrant.py,
# and the out-of-band anchor-trust config — and until now each carried its OWN
# hard-coded commit. They had drifted to THREE DIFFERENT commits spanning
# 2026-07-08 to 2026-07-27, so a single CI run tested this repo against a
# historical composite of the sibling that never existed as a state. Nothing
# reported it, because each step was individually green.
#
# A pin is still the right call — it is what makes the conformance gate
# reproducible. But there must be exactly one, and it must be visible.
#
# WHAT THE PIN MEANS: a VERIFIED COMPATIBLE BASELINE — the warrant commit whose
# consumed surfaces this repo has been checked against — not "warrant's latest".
# Being behind HEAD is the normal state and is not a defect.
#
# REFRESH ONLY when a surface consumed here actually changes: the Book I
# evaluator or its conformance behaviour, the verify-report boundary that
# tools/warrant_gate.py reads, or the anchor-trust roster. Do NOT refresh because
# `tools/x1_cross_repo.sh` reports drift — that report is context for a human,
# never a trigger. Treating "behind HEAD" as the trigger is a ping-pong
# generator: merging the pin bump moves this repo's HEAD, which obliges warrant
# to bump in reply, forever, over commits that changed nothing either consumes.
#
# A refresh commit MUST cite the old and new sibling commits, name the consumed
# surface that changed, and include the outputs run at the new pin.
env:
  WARRANT_PIN: 0d147aa12158d18e686270fe4eca2972bd4707f1
  DECISION_ARCHAEOLOGY_NEEDS_PIN: 7e9a3a9f94af28d19bfb224348162ee9cf202e61

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Full history: MAP.md records which ref holds each cited document, and
      # `repo_map.py --check-map` resolves those rows. A shallow checkout has no
      # branches to resolve them against, so the check would report everything as
      # unverifiable exactly where it is most worth running.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.12' }
      - name: Case-derived needs are structurally valid (pinned needs@v0 validator)
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/s0fractal/decision-archaeology /tmp/decision-archaeology
          git -C /tmp/decision-archaeology checkout -q "$DECISION_ARCHAEOLOGY_NEEDS_PIN"
          mapfile -d '' packets < <(find needs -mindepth 1 -maxdepth 1 -type d -print0 | sort -z)
          test "${#packets[@]}" -gt 0
          python3 /tmp/decision-archaeology/tools/validate_need.py "${packets[@]}"
      - name: DA-SIGMA-0001 owner-side reproducer
        run: python3 needs/DA-SIGMA-0001-numeral-encoding-profile/fixtures/reproduce.py
      # Mirrored from warrant (X1 enforces byte-identity of shared tooling).
      # CI has no sibling checkout, so it cannot re-resolve cross-repo citations;
      # it demands instead that every citation be accounted for in the committed
      # MAP.md. Cite a document nobody has located and this fails.
      - name: Reference map (every cited document is located in MAP.md)
        run: python3 tools/repo_map.py --check-map
      # Can Book I be implemented from Book I? The audit re-derives every
      # constant the Book prints from the Book alone, in both languages, checks
      # the prose against the normative vector suite, and requires the English
      # rendering to carry the same hashes, keywords and code. The selftest
      # breaks all of that nine ways and requires each to fail for its own
      # reason -- an audit that cannot be made to fail is not an audit.
      - name: The specification is self-contained (and the audit can fail)
        run: |
          python3 tools/spec_audit.py | tee /dev/stderr | grep -q "SPEC-AUDIT:"
          python3 tests/spec_audit_selftest.py | tee /dev/stderr \
            | grep -q "every check failed for its own reason"
      - name: Reference test vectors (Book I, hash-thunk machine)
        run: python3 impl/sigma_glyph.py | tee /dev/stderr | grep -q "ALL PASS"
      - name: Book I third implementation (Rust) + conformance differential
        shell: bash
        run: |
          set -euo pipefail
          cd impl-rs && cargo build --release --locked && cargo test --locked && cd ..
          ./impl-rs/target/release/book1 selftest | tee /dev/stderr | grep -q "SELFTEST: ALL PASS"
          ./impl-rs/target/release/book1 conformance tests/spec_conformance/vectors.json \
            | tee /dev/stderr | grep -q "RUST-CONFORMANCE: ALL PASS"
      # Cheap half of EXP-004: nine controls, each required to fail for its own
      # reason. The full corpus replay is path-filtered into its own workflow.
      - name: EXP-004 controls can fail (interaction-net harness)
        run: |
          cd experiments/exp-004
          python3 selftest.py | tee /dev/stderr \
            | grep -q "every control failed for its own reason"
      - name: Wave reference (Book II, LUT arbiter + interfere coupling)
        run: python3 impl/sigma_wave.py | tee /dev/stderr | grep -q "WAVE. ALL PASS"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: '1.22' }
      - name: Federation reference (Book III, selection-only oracle)
        run: python3 impl/sigma_federation.py | tee /dev/stderr | grep -q "FEDERATION. ALL PASS"
      - name: Federation second implementation (Go) + differential
        shell: bash
        run: |
          set -euo pipefail
          cd impl-go && go build -o sigma-federation-go . && cd ..
          ./impl-go/sigma-federation-go replay tests/spec_conformance/federation_vectors.json \
            | tee /dev/stderr | grep -q "FEDERATION-GO: ALL PASS"
          python3 tests/federation_differential.py \
            | tee /dev/stderr | grep -q "FEDERATION-DIFFERENTIAL: ALL AGREE"
      - name: Governance second implementation (Go) + differential
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --only-binary=:all: cryptography==45.0.7
          ./impl-go/sigma-federation-go gov-replay tests/spec_conformance/governance_vectors.json \
            | tee /dev/stderr | grep -q "GOVERNANCE-GO: ALL PASS"
          python3 tests/governance_differential.py \
            | tee /dev/stderr | grep -q "GOVERNANCE-DIFFERENTIAL: ALL AGREE"
      - name: Exit statuses tell the truth (a printed failure must not return 0)
        # Book I's module entry point printed FAILURES PRESENT and exited 0, so a
        # script branching on $? -- which is what CI does by default -- saw success.
        # This guard covers every module entry point and verb dispatch.
        run: |
          python3 tests/exit_status_guard.py | tee /dev/stderr \
            | grep -qx "EXIT-STATUS-GUARD: ALL PASS (15/15)"

      - name: "Book I fourth engine: warrant-go ski@v1 conformance + three-way differential fuzzer (Python/Rust/warrant-go, pinned)"
        shell: bash
        run: |
          set -euo pipefail
          # Symmetric to warrant's CI pinning sigma. One pin for the whole
          # workflow: $WARRANT_PIN, set at the top of this file.
          git clone -q https://github.com/s0fractal/warrant /tmp/warrant
          git -C /tmp/warrant checkout -q "$WARRANT_PIN"
          ( cd /tmp/warrant/impl-go && go build -o warrant-go . )
          # Substring "ALL PASS" is what let this gate accept 33 of our 49
          # vectors for weeks: warrant-go skipped the object and deserialize
          # classes and still printed a success line. The expected summary is
          # derived from OUR vector file and matched with -x, ANCHORED to a
          # whole line -- a substring match is forgeable, because the producer
          # prints one line per vector and a vector id is free-form data.
          python3 tools/book1_coverage.py --selftest | tee /dev/stderr \
            | grep -q "BOOK1-COVERAGE: SELFTEST ALL PASS"
          V=tests/spec_conformance/vectors.json
          echo "expecting: $(python3 tools/book1_coverage.py "$V")"
          # --check, not grep: the rule is POSITIONAL (the summary must be the
          # transcript's last line) because a vector id may contain newlines and
          # can otherwise forge a standalone line anywhere above it. pipefail
          # binds the producer's own exit status into the same decision.
          /tmp/warrant/impl-go/warrant-go sigma-conformance "$V" \
            | tee /dev/stderr | python3 tools/book1_coverage.py --check "$V"
          for s in 1337 4242 20240717; do
            RUST_BOOK1=./impl-rs/target/release/book1 \
            WARRANT_GO=/tmp/warrant/impl-go/warrant-go \
            python3 tests/book1_fuzz.py --terms 200 --seed "$s" \
              | tee /dev/stderr | grep -q "BOOK1-FUZZ: ALL AGREE"
          done
      - name: Conformance vectors are fresh (regenerate == no diff)
        run: |
          python3 tests/spec_conformance/generate.py
          python3 impl/sigma_wave.py gen
          python3 impl/sigma_federation.py gen
          python3 -m pip install --quiet --only-binary=:all: cryptography==45.0.7
          python3 tools/anchor_governance.py gen
          git diff --exit-code tests/spec_conformance/vectors.json tests/spec_conformance/wave_vectors.json tests/spec_conformance/federation_vectors.json tests/spec_conformance/governance_vectors.json
      - name: Conformance suite (vectors.json vs oracle)
        run: python3 tests/spec_conformance/run_reference.py
      - name: Property-based suite (seeded, stdlib-only)
        run: python3 tests/spec_conformance/test_properties.py
      - name: Verify Specification Anchors
        run: python3 tools/verify_anchors.py
      - name: Verify adjudication warrants via the warrant machine boundary (verify --store-mode --json)
        run: |
          python3 -m pip install --quiet --only-binary=:all: cryptography==45.0.7
          # Pinned to the warrant commit that ships the machine boundary (verify
          # --store-mode --json / warrant.verify-report@v0). We DOGFOOD that boundary:
          # sigma-glyph consumes the structured report through the single fail-closed
          # connector (tools/warrant_gate.py) instead of parsing human text / raw exit
          # codes. The connector trusts ONLY the documented normative fields and fails
          # closed on anything else.
          curl --proto '=https' --tlsv1.2 -sfL "https://raw.githubusercontent.com/s0fractal/warrant/$WARRANT_PIN/impl/warrant.py" -o /tmp/warrant.py
          export WARRANT="python3 /tmp/warrant.py" WARRANT_PY=/tmp/warrant.py
          # ONE settlement gate: settlement grade already includes base integrity, so a
          # single invocation binds both to one snapshot (no base/settlement TOCTOU).
          SIGMA_GLYPH=impl python3 tools/warrant_gate.py .warrants --settlement --trust-config trust-config.json
          # prove the connector's fail-closed contract (real + hostile countervectors)
          SIGMA_GLYPH=impl python3 tests/warrant_gate_test.py | tee /dev/stderr | grep -q "WARRANT-GATE: ALL PASS"
      - name: Anchor governance (GOV-anchors.md, ENFORCED — trust anchor fetched out-of-band from the warrant repo)
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/anchor_governance.py selftest | tee /dev/stderr | grep -q "ANCHOR-GOVERNANCE: ALL PASS"
          python3 tools/anchor_governance.py replay | tee /dev/stderr | grep -q "GOVERNANCE-REPLAY: ALL PASS"
          curl --proto '=https' --tlsv1.2 -sfL "https://raw.githubusercontent.com/s0fractal/warrant/$WARRANT_PIN/trust/sigma-glyph-anchor-trust.json" -o /tmp/anchor-trust.json
          python3 tools/anchor_governance.py status --enforce --trust-config /tmp/anchor-trust.json | tee /dev/stderr | grep -q "AUTHORIZED"
      - name: Two-jurisdictions federation demo (Book III live, real stores)
        shell: bash
        run: |
          set -euo pipefail
          python3 examples/two-jurisdictions/demo.py | tee /dev/stderr | grep -q "DEMO: ALL ASSERTIONS HELD"
