name: conformance
on: [push, pull_request]

# Book I and sigma-resume (resumable computation) are what this repository keeps.
# Books II and III, GOV-anchors, the Warrant 0.x apparatus and the 0.7.0 gate
# material were retired on 2026-10-31 (history/RETIREMENT-2026-10-ECHO.md): no
# step here pins a sibling repository any more.

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Full history from the start: `review verify` and `claims verify` re-execute
      # records at the commits they name.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: '3.12' }
      # This repository's records (.warrant/: schemas, pull-request heads, reviews) are
      # Warrant 3's; warrant-graph and its dependencies at exact versions and hashes.
      - name: The .warrant store under Warrant 3 (canonical, nothing rejected, no problem)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/warrant"
          "$RUNNER_TEMP/warrant/bin/pip" install --quiet --no-deps --require-hashes -r .github/warrant-requirements.txt
          "$RUNNER_TEMP/warrant/bin/warrant" status | tee /dev/stderr > /dev/null
          "$RUNNER_TEMP/warrant/bin/warrant" status --json | python3 -c 'import json, sys; d = json.load(sys.stdin); sys.exit(0 if d["canonical"] and not d["rejected"] and not d["problems"] and not d["schemas_pending"] else 1)'
      # Registered normative sentences of Book I and sigma-resume as claim@1 records (.warrant/claims.json): each
      # quotes its document, names the cases that witness it (tests/*_claims_test.py) and the mutants that
      # must break them
      # (tests/claims_mutants.py). The check refuses a sentence the Book no longer holds, a witness no test
      # prints, a mutant the harness does not list or one off its claim's cases.
      - name: The claims hold (witnesses pass, every cited mutant is killed)
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/warrant/bin/warrant" claims check
          python3 tests/book1_claims_test.py | tee /dev/stderr | grep -q "^BOOK1-CLAIMS: ALL PASS"
          python3 tests/resume_claims_test.py | tee /dev/stderr | grep -q "^RESUME-CLAIMS: ALL PASS"
          python3 tests/claims_mutants.py            # exits 0 only when every mutant is killed
      # The claims checker accepts a backed claim only after it re-ran its witnesses and mutants at one
      # commit; CI re-executes every acceptance new since the base at its commit, and the review
      # replayer's results the same way, and refuses one whose `code` is not the installed checker's.
      - name: Claims checker acceptances and review replays new since the base, re-executed at their commits
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          BASE_SHA=${BASE_SHA:-$(git rev-parse "$GITHUB_SHA^1")}
          "$RUNNER_TEMP/warrant/bin/warrant" review verify --base "$BASE_SHA"
          "$RUNNER_TEMP/warrant/bin/warrant" claims verify --base "$BASE_SHA"
      # Six version numbers in three schemes, and nothing said how they relate.
      - name: The version numbers agree with each other
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/version_check_selftest.py | tee /dev/stderr \
            | grep -q "VERSION-CHECK-SELFTEST: ALL PASS"
          python3 tools/version_check.py | tee /dev/stderr \
            | grep -q "VERSION-CHECK:"
      # A normative JSON artifact needs a normative shape. The shape is an
      # anchored closed-world schema; the selftest breaks each rule so the
      # validator is known to be able to fail.
      - name: Every normative suite matches its anchored schema
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/suite_schema.py --selftest | tee /dev/stderr \
            | grep -q "SUITE-SCHEMA-SELFTEST: ALL PASS"
          python3 tools/suite_schema.py | tee /dev/stderr \
            | grep -q "SUITE-SCHEMA: ALL PASS"
      - name: The conformance runner checks four observables, not two
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/conformance_runner_selftest.py | tee /dev/stderr \
            | grep -q "CONFORMANCE-RUNNER-SELFTEST: ALL PASS"
      # Can Book I be implemented from Book I? The audit re-derives every
      # constant the Book prints from the Book alone, in both languages, checks
      # the prose against the normative vector suite, and requires the English
      # rendering to carry the same hashes, keywords and code. The selftest
      # breaks all of that nine ways and requires each to fail for its own
      # reason -- an audit that cannot be made to fail is not an audit.
      - name: The specification is self-contained (and the audit can fail)
        run: |
          python3 tools/spec_audit.py | tee /dev/stderr | grep -q "SPEC-AUDIT:"
          python3 tests/spec_audit_selftest.py | tee /dev/stderr \
            | grep -q "every check failed for its own reason"
      # Admission, the content address and uint32 domain, and the Receipt are Book I claims now
      # (BOOK1-3.4-*, BOOK1-3.5-1, BOOK1-3.6-*: tests/book1_claims_test.py, run above).
      - name: Reference test vectors (Book I, hash-thunk machine)
        run: python3 impl/sigma_glyph.py | tee /dev/stderr | grep -q "ALL PASS"
      - name: Book I third implementation (Rust) + conformance differential
        shell: bash
        run: |
          set -euo pipefail
          cd impl-rs && cargo build --release --locked && cargo test --locked && cd ..
          ./impl-rs/target/release/book1 selftest | tee /dev/stderr | grep -q "SELFTEST: ALL PASS"
          ./impl-rs/target/release/book1 conformance tests/spec_conformance/vectors.json \
            | tee /dev/stderr | grep -q "RUST-CONFORMANCE: ALL PASS"
          # Generated terms, Python oracle against Rust (the third engine, warrant-go, left with Warrant 0.x).
          for s in 1337 4242 20240717; do
            RUST_BOOK1=./impl-rs/target/release/book1 python3 tests/book1_fuzz.py --terms 200 --seed "$s" \
              | tee /dev/stderr | grep -q "BOOK1-FUZZ: ALL AGREE"
          done
      # sigma-resume (spec/sigma-resume.md): the matrix, its on-target mutants, the Python = Rust
      # differential and the broken-engine controls.
      - name: sigma-resume kernel (matrix, mutants, Python = Rust, controls)
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/resume_test.py | tee /dev/stderr | grep -q "^SIGMA-RESUME: [0-9]* PASS, 0 FAIL"
          python3 tests/resume_mutants.py | tee /dev/stderr | grep -q "RESUME MUTANTS: ALL KILLED ON TARGET"
          python3 tests/resume_differential.py | tee /dev/stderr | grep -q "RESUME DIFFERENTIAL: ALL AGREE"
          sh tests/resume_differential_controls.sh | tee /dev/stderr | grep -q "DIFFERENTIAL CONTROLS: ALL BITE"
      # The resume provider as a consumer gets it: a wheel built from this commit,
      # installed in a fresh environment, run from outside the checkout. The same
      # gate publish.yml runs, here on every change, so a module the provider
      # needs cannot silently stay out of the wheel.
      - name: sigma-resume provider, installed (wheel, fresh venv, no checkout on the path)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip wheel --quiet --no-deps -w "$RUNNER_TEMP/wheelhouse" .
          python3 -m venv "$RUNNER_TEMP/pv"
          "$RUNNER_TEMP/pv/bin/pip" install --quiet "$RUNNER_TEMP"/wheelhouse/sigma_glyph-*.whl
          python3 tools/check_release_surface.py --wheel "$RUNNER_TEMP"/wheelhouse/sigma_glyph-*.whl --bin "$RUNNER_TEMP/pv/bin" \
            | tee /dev/stderr | grep -q "^RELEASE SURFACE: ALL PASS"
          python3 tests/provider_protocol_test.py --python "$RUNNER_TEMP/pv/bin/python" \
            | tee /dev/stderr | grep -q "^PROVIDER-PROTOCOL (installed): ALL PASS"
          python3 tests/provider_resume_test.py --python "$RUNNER_TEMP/pv/bin/python" \
            | tee /dev/stderr | grep -q "^PROVIDER-RESUME (installed): ALL PASS"
      - name: Exit statuses tell the truth (a printed failure must not return 0)
        # Book I's module entry point printed FAILURES PRESENT and exited 0, so a
        # script branching on $? -- which is what CI does by default -- saw success.
        # This guard covers every module entry point and verb dispatch.
        run: |
          python3 tests/exit_status_guard.py | tee /dev/stderr \
            | grep -qx "EXIT-STATUS-GUARD: ALL PASS (5/5)"

      - name: Conformance vectors are fresh (regenerate == no diff)
        run: |
          python3 tests/spec_conformance/generate.py
          git diff --exit-code tests/spec_conformance/vectors.json
      - name: Conformance suite (vectors.json vs oracle)
        run: python3 tests/spec_conformance/run_reference.py
      - name: Property-based suite (seeded, stdlib-only)
        run: python3 tests/spec_conformance/test_properties.py
