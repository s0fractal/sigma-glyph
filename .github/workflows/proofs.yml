name: proofs
on: [push, pull_request]
jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install elan (pinned installer, pinned toolchain)
        # This workflow decides whether the proofs check out, so the code that
        # sets it up is part of what the proofs rest on. It used to pipe
        # elan-init.sh from `master` straight into sh: a mutable ref, in a
        # repository that pins every action to a commit. Anyone able to move
        # that branch could run arbitrary code inside the job that validates
        # the mechanization. Now pinned by commit AND verified by digest --
        # the pin alone would still trust raw.githubusercontent to serve that
        # commit honestly, and the digest is what makes the fetch checkable.
        env:
          ELAN_INIT_COMMIT: 55dc2814ca42ace25f05ba4dd7a43a8c701a0549
          ELAN_INIT_SHA256: a620ff1641616222c8d37c54845492004bb84d6877cdbc944dd65c1aa685bf53
        run: |
          curl -sSf "https://raw.githubusercontent.com/leanprover/elan/${ELAN_INIT_COMMIT}/elan-init.sh" \
            -o elan-init.sh
          echo "${ELAN_INIT_SHA256}  elan-init.sh" | sha256sum -c -
          sh elan-init.sh -y --default-toolchain "$(cat proofs/lean-toolchain)"
          rm -f elan-init.sh
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check the memory-bound proof
        # `lean` exits 0 on a file containing `sorry` (warning only), and it
        # exits 0 on a VACUOUS theorem too; the real guard over SizeBound.lean
        # (axiom cone + pinned statement + source denylist) lives in
        # bridge_check.py below, matching how every other proof file is
        # guarded by its bridge.
        run: lean proofs/SizeBound.lean && echo "PROOF CHECKS"
      - name: Bridge - step premise holds on live oracle traces (+ SizeBound no-sorry guard)
        run: python3 proofs/bridge_check.py
      - name: Wave-algebra proofs + differential bridge (Book II)
        shell: bash
        run: |
          set -euo pipefail
          python3 proofs/wave_bridge_check.py | tee /dev/stderr | grep -q "WAVE-BRIDGE: ALL AGREE"
      - name: Byte-level machine correspondence + differential bridge (Book I bytes)
        shell: bash
        run: |
          set -euo pipefail
          python3 proofs/byte_bridge_check.py | tee /dev/stderr | grep -q "BYTE-BRIDGE: ALL AGREE"
      - name: Evaluator determinism/totality + differential bridge (Book I eval)
        shell: bash
        run: |
          set -euo pipefail
          python3 proofs/eval_bridge_check.py | tee /dev/stderr | grep -q "EVAL-BRIDGE: ALL AGREE"
      - name: C1 compiler FV-preservation/closedness + differential bridge (Book I §6)
        shell: bash
        run: |
          set -euo pipefail
          python3 proofs/c1_bridge_check.py | tee /dev/stderr | grep -q "C1-BRIDGE: ALL AGREE"
      - name: Guard regression - soundness guard rejects every proven bypass vector
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/proof_guard_test.py | tee /dev/stderr | grep -q "PROOF-GUARD: ALL PASS"
