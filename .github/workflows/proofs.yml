name: proofs
on: [push, pull_request]
jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install elan (pinned toolchain)
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain "$(cat proofs/lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check the memory-bound proof
        # `lean` exits 0 on a file containing `sorry` (warning only), and it
        # exits 0 on a VACUOUS theorem too; the real guard over SizeBound.lean
        # (axiom cone + pinned statement + source denylist) lives in
        # bridge_check.py below, matching how every other proof file is
        # guarded by its bridge.
        run: lean proofs/SizeBound.lean && echo "PROOF CHECKS"
      - name: Bridge - step premise holds on live oracle traces (+ SizeBound no-sorry guard)
        run: python3 proofs/bridge_check.py
      - name: Wave-algebra proofs + differential bridge (Book II)
        shell: bash
        run: |
          set -euo pipefail
          python3 proofs/wave_bridge_check.py | tee /dev/stderr | grep -q "WAVE-BRIDGE: ALL AGREE"
      - name: Byte-level machine correspondence + differential bridge (Book I bytes)
        shell: bash
        run: |
          set -euo pipefail
          python3 proofs/byte_bridge_check.py | tee /dev/stderr | grep -q "BYTE-BRIDGE: ALL AGREE"
      - name: Evaluator determinism/totality + differential bridge (Book I eval)
        shell: bash
        run: |
          set -euo pipefail
          python3 proofs/eval_bridge_check.py | tee /dev/stderr | grep -q "EVAL-BRIDGE: ALL AGREE"
      - name: C1 compiler FV-preservation/closedness + differential bridge (Book I §6)
        shell: bash
        run: |
          set -euo pipefail
          python3 proofs/c1_bridge_check.py | tee /dev/stderr | grep -q "C1-BRIDGE: ALL AGREE"
      - name: Guard regression - soundness guard rejects every proven bypass vector
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/proof_guard_test.py | tee /dev/stderr | grep -q "PROOF-GUARD: ALL PASS"
